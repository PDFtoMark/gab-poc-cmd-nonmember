name: Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  is-org-member:
    if: startsWith(github.event.comment.body, '/cmd')
    runs-on: ubuntu-latest
    outputs:
      member: ${{ steps.is-member.outputs.result }}
    steps:
      # PoC adaptation: the real workflow mints a CMD bot GitHub App token and calls
      # orgs.checkMembershipForUser. The test org has no such app, so we emulate the result
      # the real check returns for any outside user (non-member).
      - name: Check if user is a member of the organization (emulated: non-member)
        id: is-member
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            return 'false';

  acknowledge:
    if: ${{ startsWith(github.event.comment.body, '/cmd') }}
    runs-on: ubuntu-latest
    steps:
      - name: Add reaction to triggered comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.reactions.createForIssueComment({
              comment_id: ${{ github.event.comment.id }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: 'eyes'
            })

  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Clean previous comments
        if: ${{ startsWith(github.event.comment.body, '/cmd') && contains(github.event.comment.body, '--clean') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('clean');

  get-pr-info:
    if: ${{ startsWith(github.event.comment.body, '/cmd') }}
    runs-on: ubuntu-latest
    outputs:
      CMD: ${{ steps.get-comment.outputs.group2 }}
      pr-branch: ${{ steps.get-pr.outputs.pr_branch }}
      repo: ${{ steps.get-pr.outputs.repo }}
    steps:
      - name: Get command
        uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2.0.2
        id: get-comment
        with:
          text: ${{ github.event.comment.body }}
          regex: "^(\\/cmd )([-\\/\\s\\w.=:]+)$"

      - name: Check if the issue is a PR
        id: check-pr
        run: |
          if [ -n "${{ github.event.issue.pull_request.url }}" ]; then
            echo "This is a pull request comment"
          else
            echo "This is not a pull request comment"
            exit 1
          fi

      - name: Get PR Branch Name and Repo
        if: steps.check-pr.outcome == 'success'
        id: get-pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('pr_branch', pr.data.head.ref);
            core.setOutput('repo', pr.data.head.repo.full_name);

  set-image:
    needs: [clean, get-pr-info]
    if: ${{ startsWith(github.event.comment.body, '/cmd') && !contains(github.event.comment.body, '--help') }}
    runs-on: ubuntu-latest
    env:
      CMD: ${{ needs.get-pr-info.outputs.CMD }}
    outputs:
      IMAGE: ${{ steps.set-image.outputs.IMAGE }}
      RUNNER: ${{ steps.set-image.outputs.RUNNER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: set-image
        run: |
          BODY=$(echo "$CMD" | xargs)
          IMAGE_OVERRIDE=$(echo $BODY | grep -oe 'docker.io/paritytech/ci-unified:.*\s' | xargs)

          cat .github/env >> $GITHUB_OUTPUT

          if [ -n "$IMAGE_OVERRIDE" ]; then
              IMAGE=$IMAGE_OVERRIDE
              echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          fi

          if [[ $BODY == "bench"* ]]; then
              echo "RUNNER=parity-weights" >> $GITHUB_OUTPUT
          elif [[ $BODY == "update-ui"* ]]; then
              echo "RUNNER=parity-large" >> $GITHUB_OUTPUT
          else
              echo "RUNNER=ubuntu-latest" >> $GITHUB_OUTPUT
          fi

  check-pr-author:
    runs-on: ubuntu-latest
    outputs:
      is_author: ${{ steps.check-author.outputs.result }}
    steps:
      - name: Check if user is PR author (emulated with repo token)
        id: check-author
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const commentUser = '${{ github.event.comment.user.login }}';
            const prNumber = ${{ github.event.issue.number }};
            try {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              return commentUser === pr.data.user.login ? 'true' : 'false';
            } catch (error) {
              return 'false';
            }

  run-cmd-workflow:
    needs: [set-image, get-pr-info, is-org-member, check-pr-author]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.comment.body, '/cmd') && !contains(github.event.comment.body, '--help') }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    env:
      CMD: ${{ needs.get-pr-info.outputs.CMD }}
      PR_BRANCH: ${{ needs.get-pr-info.outputs.pr-branch }}
      RUNNER: ${{ needs.set-image.outputs.RUNNER }}
      IMAGE: ${{ needs.set-image.outputs.IMAGE }}
      REPO: ${{ needs.get-pr-info.outputs.repo }}
      IS_ORG_MEMBER: ${{ needs.is-org-member.outputs.member }}
      IS_PR_AUTHOR: ${{ needs.check-pr-author.outputs.is_author }}
      COMMENT_ID: ${{ github.event.comment.id }}
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start cmd with gh cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "dispatching with is_org_member=${IS_ORG_MEMBER} repo=${REPO} branch=${PR_BRANCH}"
          gh workflow run cmd-run.yml \
            --ref cmd-bot \
            -f cmd="${CMD}" \
            -f repo="${REPO}" \
            -f pr_branch="${PR_BRANCH}" \
            -f pr_num="${PR_NUMBER}" \
            -f runner="${RUNNER}" \
            -f is_org_member="${IS_ORG_MEMBER}" \
            -f is_pr_author="${IS_PR_AUTHOR}" \
            -f comment_id="${COMMENT_ID}" \
            -f image="${IMAGE}" \
            -f is_quiet="${{ contains(github.event.comment.body, '--quiet') }}"
